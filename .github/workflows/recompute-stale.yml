name: Hourly recompute-stale

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 to spread load away from the top
  workflow_dispatch: {} # manual trigger for ad-hoc kicks

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/recompute-stale
        env:
          BASE_URL: ${{ secrets.STONETRADE_BASE_URL }}
          CRON_TOKEN: ${{ secrets.STONETRADE_CRON_TOKEN }}
        # Skip-on-missing-secrets is intentional during pre-deploy. The
        # secrets are set in the repo's GitHub Actions config once the
        # app is reachable from GitHub-hosted runners (Settings → Secrets
        # and variables → Actions). Until then, exiting 0 with a
        # ::warning:: surfaces a yellow annotation on the Actions tab
        # without flooding the notification inbox every hour.
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "::warning::Skipping recompute-stale — STONETRADE_BASE_URL and/or STONETRADE_CRON_TOKEN repo secret not set. Configure both once the app is deployed."
            exit 0
          fi
          curl -fsS -X POST \
            "$BASE_URL/api/admin/recompute-stale?olderThanMinutes=60&maxCards=500" \
            -H "Authorization: Bearer $CRON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
