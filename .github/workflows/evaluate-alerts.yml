name: Evaluate alerts

on:
  schedule:
    - cron: "33 */6 * * *" # every 6h at :33; 24h cooldown means more frequent gains nothing
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/admin/alerts/evaluate
        env:
          BASE_URL: ${{ secrets.STONETRADE_BASE_URL }}
          CRON_TOKEN: ${{ secrets.STONETRADE_CRON_TOKEN }}
        # See companion comment in recompute-stale.yml for the rationale —
        # skip-on-missing-secrets is intentional pre-deploy; once secrets
        # are configured this becomes the live evaluation path.
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "::warning::Skipping alerts evaluation — STONETRADE_BASE_URL and/or STONETRADE_CRON_TOKEN repo secret not set. Configure both once the app is deployed."
            exit 0
          fi
          curl -fsS -X POST \
            "$BASE_URL/api/admin/alerts/evaluate" \
            -H "Authorization: Bearer $CRON_TOKEN" \
            -d '{}'
